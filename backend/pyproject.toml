[project]
name = "car-rental-backend"
version = "0.1.0"
description = "FastAPI backend for the South African car rental platform"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # pytest asserts; fake credentials in test data
"migrations/versions/**" = ["E501"]  # generated DDL with long literal lines
