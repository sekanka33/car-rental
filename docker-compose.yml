# Local development services. Not for production use.
# Usage: cp .env.example .env  (set POSTGRES_PASSWORD), then `docker compose up -d db`
services:
  db:
    image: postgres:16-alpine
    container_name: car-rental-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-car_rental}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the repository-root .env file}
      POSTGRES_DB: ${POSTGRES_DB:-car_rental}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-car_rental_test}
      TZ: UTC
    ports:
      # Bound to localhost only; 5433 avoids clashing with a system PostgreSQL on 5432.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - car_rental_db_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  car_rental_db_data:
