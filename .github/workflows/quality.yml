name: Quality checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: car_rental
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: car_rental_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U car_rental -d car_rental_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://car_rental:ci-test-password@localhost:5432/car_rental_test
      TEST_DATABASE_URL: postgresql+psycopg://car_rental:ci-test-password@localhost:5432/car_rental_test
      JWT_SECRET_KEY: ci-only-jwt-secret-key-with-at-least-thirty-two-characters
      DOCUMENT_HASH_KEY: ci-only-document-hash-key-with-at-least-thirty-two-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: pytest -ra
        working-directory: backend
      - run: ruff check . && ruff format --check .
        working-directory: backend
      - run: alembic check
        working-directory: backend
      - run: pip-audit -r requirements.txt
        working-directory: backend

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npm test -- --runInBand
        working-directory: mobile
      - run: npm run typecheck && npm run lint
        working-directory: mobile
      - run: npm audit --audit-level=critical
        working-directory: mobile

  admin-dashboard:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: https://api.example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin-dashboard/package-lock.json
      - run: npm ci
        working-directory: admin-dashboard
      - run: npm test
        working-directory: admin-dashboard
      - run: npm run typecheck && npm run lint && npm run build
        working-directory: admin-dashboard
      - run: npm audit --audit-level=critical
        working-directory: admin-dashboard

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install detect-secrets==1.5.0
      - run: git ls-files -z | xargs -0 detect-secrets-hook -n --baseline .secrets.baseline --exclude-files '^\.secrets\.baseline$'
